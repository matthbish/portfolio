<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal showing git-toolbox usage">
  <rect width="1200" height="675" fill="#0d0d0d"/>

  <rect x="60" y="70" width="1080" height="515" rx="10" fill="#1e1e1e" stroke="#333333" stroke-width="1.5"/>

  <rect x="60" y="70" width="1080" height="44" rx="10" fill="#2a2a2a"/>
  <rect x="60" y="98" width="1080" height="16" fill="#2a2a2a"/>
  <circle cx="90" cy="92" r="7" fill="#e5484d"/>
  <circle cx="114" cy="92" r="7" fill="#e0a300"/>
  <circle cx="138" cy="92" r="7" fill="#4caf50"/>
  <text x="600" y="98" text-anchor="middle" font-family="'SF Mono','Cascadia Code','Fira Code',Consolas,monospace" font-size="16" fill="#b0b0b0">git-toolbox</text>

  <g font-family="'SF Mono','Cascadia Code','Fira Code',Consolas,monospace" font-size="21" xml:space="preserve">
    <text x="92" y="190" fill="#4caf50">$ <tspan fill="#f5f5f5">npm install -g @matthbish/git-toolbox</tspan></text>

    <text x="92" y="244" fill="#4caf50">$ <tspan fill="#f5f5f5">git toolbox push "add search endpoint"</tspan></text>
    <text x="92" y="278" fill="#b0b0b0">Pushed 'feature/search' to origin.</text>

    <text x="92" y="332" fill="#4caf50">$ <tspan fill="#f5f5f5">git toolbox squash 3 "implement search endpoint"</tspan></text>
    <text x="92" y="366" fill="#b0b0b0">Squashed 3 commits into one and force-pushed 'feature/search'.</text>

    <text x="92" y="420" fill="#4caf50">$ <tspan fill="#f5f5f5">git toolbox clean-branches review- --dry-run</tspan></text>
    <text x="92" y="454" fill="#b0b0b0">Would delete 2 branch(es): review-auth, review-search</text>

    <text x="92" y="508" fill="#4caf50">$ <tspan fill="#666666">▍</tspan></text>
  </g>
</svg>
