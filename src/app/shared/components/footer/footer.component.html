<footer class="site-footer">
  <div class="footer-inner">
    <app-logo [compact]="true"></app-logo>
    <nav class="footer-links" aria-label="Social links">
      @for (link of links; track link.label) {
        <a
          [href]="link.url"
          [attr.target]="link.external ? '_blank' : null"
          [attr.rel]="link.external ? 'noopener noreferrer' : null"
        >
          {{ link.label }}
          @if (link.external) {
            <span class="sr-only">(opens in new window)</span>
          }
        </a>
      }
    </nav>
    <p class="footer-copy">
      &copy; {{ year }} Matthew Bishop -
      <span class="footer-build">
        {{ buildInfo.engine }} · v{{ buildInfo.version }} · {{ buildInfo.branch }}
      </span>
    </p>
  </div>
</footer>
